# .pre-commit-config.yaml: the-hardline/the-hardline.github.io. The check refuses a secret and nothing else.

minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # The commit-time gate: scans the staged lines. GitHub secret scanning covers the whole history.
      - id: gitleaks
        stages: [pre-commit]
