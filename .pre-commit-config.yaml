# .pre-commit-config.yaml: the-hardline/the-hardline.github.io. The check refuses a secret and nothing else.

minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Two entries because the stock hook scans STAGED lines only; in CI nothing is staged.
      #   gitleaks      — the commit-time gate.
      #   gitleaks-dir  — the whole-tree pass. `dir` also reads untracked and gitignored files,
      #                   so it is manual-stage and run by ci.yml on a fresh checkout only.
      - id: gitleaks
        stages: [pre-commit]
      - id: gitleaks
        alias: gitleaks-dir
        name: Detect hardcoded secrets (whole tree)
        entry: gitleaks dir . --redact --exit-code 1
        pass_filenames: false
        always_run: true
        stages: [manual]
