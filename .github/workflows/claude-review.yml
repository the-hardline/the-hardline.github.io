# claude-review.yml — Claude reviews every pull request, comments, and fails on an Important finding.
#
# The shape is the review workflow from Claude Code's GitHub Actions page, §Run a skill
# (https://code.claude.com/docs/en/github-actions): the `code-review` plugin's skill, run with
# `--comment`, posts an inline comment per finding or one summary comment when it finds none.
# The skill skips draft pull requests, so `ready_for_review` starts the review of one that opened
# as a draft. It authenticates with the owner's Claude subscription through the
# CLAUDE_CODE_OAUTH_TOKEN repository secret, made with `claude setup-token`.
#
# README.md says what this repository holds, and the review reads a pull request against it;
# REVIEW.md holds what counts as important, the nit cap and what to skip. The plugin reads
# only CLAUDE.md files, so the two are joined into one file appended to the system prompt with
# `--append-system-prompt-file`.
#
# The job is a required check on `main` beside `pre-commit (whole tree)`: it fails when the review
# left a 🔴 Important inline comment on the pull request's head commit, so auto-merge waits for a
# push that fixes it. A 🟡 Nit never fails it.
#
# Actions are pinned by full commit SHA, a tag being mutable.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Join the review instructions
        run: cat README.md REVIEW.md > "$RUNNER_TEMP/review-instructions.md"

      - uses: anthropics/claude-code-action@25e67a749845f3eb2c30bd814f65dca12c3bb8c3 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment" --append-system-prompt-file ${{ runner.temp }}/review-instructions.md'

      - name: Fail on an Important finding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          n=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/comments" \
            --jq ".[] | select(.user.login == \"claude[bot]\" and .original_commit_id == \"$HEAD_SHA\" and (.body | startswith(\"🔴\"))) | .id" | wc -l)
          echo "$n Important finding(s) on $HEAD_SHA"
          [ "$n" -eq 0 ]
