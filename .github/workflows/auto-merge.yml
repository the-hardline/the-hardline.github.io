# auto-merge.yml — every ready pull request merges itself once the required checks pass.
#
# The job is construct's reusable workflow, run here on the same event with this repository's
# `auto-merge` environment, App key secret and client-id variable. What it does, and why it acts
# as the organisation's GitHub App, is written at its head:
# https://github.com/the-hardline/construct/blob/main/.github/workflows/auto-merge.yml
name: auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    uses: the-hardline/construct/.github/workflows/auto-merge.yml@main
    secrets: inherit
